# cargo-deny configuration. Run with: cargo deny check
# Keep this strict now; relax deliberately, with a comment explaining why.

[advisories]
# Known vulnerabilities always fail; yanked crates fail too.
yanked = "deny"

[licenses]
# Only permissive licenses are allowed by default.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
]
confidence-threshold = 0.9
# Many allowed licenses won't appear until dependencies are added.
unused-allowed-license = "allow"

# ApplyShield itself is unpublished and its own license is still undecided.
# Remove this once a LICENSE file is chosen and added.
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
# Dependencies may only come from crates.io: no random git or path sources.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
